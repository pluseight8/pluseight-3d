<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efede5">
  <meta name="description" content="Личный сайт pluseight с интерактивной 3D-восьмёркой, анимированным фоном и двадцатью оформлениями.">
  <title>pluseight — интерактивный автопортрет</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/vendor/space-grotesk-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./assets/style.css?v=3">
  <link rel="stylesheet" href="./assets/themes.css">
  <link rel="stylesheet" href="./assets/themes-print.css">
  <link rel="stylesheet" href="./assets/themes-digital.css">
  <link rel="stylesheet" href="./assets/themes-material.css">
  <script src="./assets/themes.js"></script>
  <script type="module" src="./assets/main.js?v=2"></script>
</head>
<body id="top">
  <a class="skip-link" href="#intro">К содержанию</a>
  <div class="sheet">
    <div class="background-art" id="background-art" aria-hidden="true"></div>
    <div class="theme-decoration" aria-hidden="true"></div>
    <header class="masthead">
      <a class="brand" href="#top" aria-label="pluseight — начало страницы">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>pluseight</span>
      </a>
      <div class="header-actions">
        <nav aria-label="Навигация по сайту">
          <a class="nav-intro" href="#intro" aria-current="location">Обложка</a>
          <a class="nav-scene" href="#scene">3D-сцена</a>
          <a class="source-link" href="https://github.com/pluseight8">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
        <div class="style-tools" role="group" aria-label="Оформление сайта" hidden>
          <button class="style-step" id="style-prev" type="button" aria-label="Предыдущий стиль" title="Предыдущий стиль">‹</button>
          <button class="style-open" id="style-open" type="button" aria-haspopup="dialog" aria-controls="style-dialog">
            <span class="style-swatch" aria-hidden="true"></span>
            <span>Стили</span>
            <span class="style-position" id="style-position" aria-hidden="true">01 / 20</span>
          </button>
          <button class="style-step" id="style-next" type="button" aria-label="Следующий стиль" title="Следующий стиль">›</button>
        </div>
        <span class="visually-hidden" id="style-status" role="status"></span>
      </div>
    </header>

    <main class="composition">
      <section class="intro" id="intro" aria-labelledby="title">
        <p class="eyebrow"><span aria-hidden="true"></span>Личный сайт</p>
        <h1 class="wordmark" id="title" aria-label="pluseight">
          <span aria-hidden="true">plus</span>
          <span class="outline" aria-hidden="true">eight<span class="wordmark-dot">.</span></span>
        </h1>
        <a class="primary" href="#scene" id="explore">
          <span>Открыть сцену</span><span class="primary-arrow" aria-hidden="true">↘</span>
        </a>
      </section>

      <figure class="scene" id="scene" aria-labelledby="scene-label">
        <figcaption class="scene-header">
          <span class="scene-caption" id="scene-label"><span class="caption-cross" aria-hidden="true"></span>Форма 08</span>
          <span class="scene-type" id="scene-type"><span aria-hidden="true"></span><span id="scene-state">Three.js</span></span>
        </figcaption>
        <div class="viewport" id="viewport">
          <div class="register" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="scene-axis" aria-hidden="true"></div>
          <div class="scale scale-left" aria-hidden="true"></div>
          <div class="scale scale-right" aria-hidden="true"></div>
          <div class="poster" aria-hidden="true"></div>
          <div class="canvas-mount" id="canvas-mount" role="group" tabindex="-1" aria-label="Интерактивная 3D-восьмёрка" aria-describedby="scene-help"></div>
        </div>
        <div class="scene-footer">
          <p class="scene-help" id="scene-help">Статичный ракурс</p>
          <div class="controls" id="scene-controls" hidden>
            <div class="mode-switch" role="group" aria-label="Режим отображения">
              <button type="button" data-mode="solid" aria-pressed="true">Объём</button>
              <button type="button" data-mode="wire" aria-pressed="false">Каркас</button>
            </div>
            <button class="icon-button" type="button" id="motion" aria-label="Автоматическое движение" aria-pressed="true" title="Пауза анимации">
              <span class="motion-icon" aria-hidden="true"></span>
            </button>
            <button class="icon-button reset" type="button" id="reset" aria-label="Вернуть исходный ракурс" title="Вернуть исходный ракурс">↺</button>
          </div>
        </div>
        <noscript><p class="no-script">Для интерактивной сцены включите JavaScript.</p></noscript>
      </figure>
    </main>

    <footer class="site-footer">
      <span><span class="footer-mark" aria-hidden="true">×</span> pluseight</span>
      <a href="https://github.com/pluseight8/pluseight-3d">Исходный код <span aria-hidden="true">↗</span></a>
    </footer>
  </div>

  <dialog class="style-dialog" id="style-dialog" aria-labelledby="style-title">
    <div class="style-panel">
      <header class="style-panel-header">
        <div>
          <h2 id="style-title">Стили</h2>
          <p id="style-count">20 оформлений</p>
        </div>
        <button class="style-close" id="style-close" type="button" aria-label="Закрыть выбор стиля" autofocus>×</button>
      </header>
      <div class="style-gallery" id="style-gallery"></div>
    </div>
  </dialog>
</body>
</html>
